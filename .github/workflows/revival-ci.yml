name: RevivalPaper CI

on:
  push:
    branches: [ "ver/26.2" ]
  pull_request:
    branches: [ "ver/26.2" ]
  workflow_dispatch:

concurrency:
  group: revival-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Leaf's own workflows only run on Winds-Studio/Leaf; this one only runs on the fork
    if: ${{ github.repository == 'hcfrevival/RevivalPaper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MC_VERSION: "26.2"
      # Read access to hcfrevival/core for the core contract tests; the steps are skipped without it
      CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Check RevivalPaper hooks survived patching
        run: python3 scripts/revival/check-markers.py
      - name: Run RevivalPaper tests
        run: ./gradlew :leaf-server:runRevivalTests --stacktrace --no-daemon
      - name: Create Paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon
      - name: Run live-server tests (sync and async entity tracker)
        run: |
          ./gradlew :leaf-server:revivalLiveTestPlugin --stacktrace --no-daemon
          python3 scripts/revival/live-tests.py

      - name: Check out core for contract tests
        if: ${{ env.CORE_READ_TOKEN != '' }}
        uses: actions/checkout@v5
        with:
          repository: hcfrevival/core
          ref: dev
          token: ${{ env.CORE_READ_TOKEN }}
          path: core
      - name: Run core contract tests
        if: ${{ env.CORE_READ_TOKEN != '' }}
        # Reports without blocking until core's Rogue harness uses RevivalPaper's numbers (core PR C1)
        continue-on-error: true
        run: |
          ./gradlew :leaf-api:jar --stacktrace --no-daemon
          (cd core && chmod +x mvnw && ./mvnw -q -B -pl classes,essentials,events,factions,arena -am package -DskipTests)
          python3 scripts/revival/core-contract.py --core core

      - name: Rename Paperclip jar
        run: |
          mv leaf-server/build/libs/leaf-paperclip-${{ env.MC_VERSION }}*.jar ./revivalpaper-${{ env.MC_VERSION }}.jar

      - name: Upload RevivalPaper
        uses: actions/upload-artifact@v7
        with:
          path: ./revivalpaper-${{ env.MC_VERSION }}.jar
          archive: false

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: revival-test-reports
          path: |
            leaf-server/build/reports/tests/
            leaf-server/build/revival-live/logs/
          if-no-files-found: ignore
